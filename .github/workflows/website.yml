name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/sync-playlist.mjs', '.github/workflows/website.yml']
  schedule:
    - cron: '0 */6 * * *' # re-sync the YouTube playlist every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync playlist
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        if: ${{ env.YT_API_KEY != '' }}
        run: node scripts/sync-playlist.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
