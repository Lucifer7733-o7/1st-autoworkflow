<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4aa3ff" />
    <title>Long Drive Radio</title>
    <meta name="description" content="Endless roads, good weather, and my playlist on repeat." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <div class="ui">
      <header class="topbar">
        <a class="brand" href="./" id="brand">Long Drive Radio</a>
        <div class="topbar__actions">
          <button class="chip" id="weather" type="button" title="Change the time of day">
            <span class="chip__icon" id="weather-icon">☀️</span><span id="weather-label">Sunny day</span>
          </button>
          <button class="chip" id="open-list" type="button" aria-controls="playlist" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h13M3 12h13M3 18h9M19 14v7M16 17.5h6" /></svg>
            <span>Playlist <span class="count" id="count"></span></span>
          </button>
        </div>
      </header>

      <section class="hero" id="hero">
        <h1 id="tagline">Endless roads, good weather, and my playlist on repeat.</h1>
        <button class="start" id="start" type="button" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" /></svg>
          <span id="start-label">Loading playlist…</span>
        </button>
        <p class="hero__hint" id="status" role="status"></p>
      </section>

      <aside class="drawer" id="playlist" aria-label="Playlist" hidden>
        <div class="drawer__head">
          <h2>Road trip playlist</h2>
          <button class="icon" id="close-list" type="button" aria-label="Close playlist">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <input class="search" id="search" type="search" placeholder="Search songs" aria-label="Search songs" />
        <ol class="tracks" id="tracks"></ol>
      </aside>

      <section class="stereo" id="stereo" aria-label="Player">
        <div class="stereo__screen">
          <div id="yt"></div>
        </div>
        <div class="stereo__body">
          <div class="stereo__now">
            <p class="stereo__eyebrow"><span class="dot" id="live-dot"></span><span id="speed">0 km/h</span> · <span id="odo">0.0 km driven</span></p>
            <p class="stereo__title" id="title">Ready when you are</p>
            <p class="stereo__artist" id="artist">Press play to start the drive</p>
          </div>
          <div class="stereo__progress">
            <span id="elapsed">0:00</span>
            <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Seek" />
            <span id="total">0:00</span>
          </div>
          <div class="stereo__controls">
            <button class="icon toggle" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false" title="Shuffle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" /></svg>
            </button>
            <button class="icon" id="prev" type="button" aria-label="Previous song">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 5.5v13a1 1 0 0 1-1.5.86l-10-6.5a1 1 0 0 1 0-1.72l10-6.5A1 1 0 0 1 19 5.5z" /><rect x="4.5" y="4" width="2.5" height="16" rx="1" /></svg>
            </button>
            <button class="play" id="play" type="button" aria-label="Play" disabled>
              <svg class="i-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" /></svg>
              <svg class="i-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
            </button>
            <button class="icon" id="next" type="button" aria-label="Next song">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 5 5.5z" /><rect x="17" y="4" width="2.5" height="16" rx="1" /></svg>
            </button>
            <button class="icon toggle" id="repeat" type="button" aria-label="Repeat all" title="Repeat all">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3" /></svg>
              <span class="badge" id="repeat-one" hidden>1</span>
            </button>
          </div>
          <div class="stereo__volume">
            <button class="icon" id="mute" type="button" aria-label="Mute">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z" /><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" /><path class="cross" d="m22 9-6 6M16 9l6 6" /></svg>
            </button>
            <input type="range" id="volume" min="0" max="100" step="1" value="80" aria-label="Volume" />
          </div>
        </div>
      </section>

      <footer class="footer" id="footer"></footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
